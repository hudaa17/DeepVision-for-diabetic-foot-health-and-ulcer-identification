name: DeepVision Backend CI/CD

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install Ruff
        run: pip install ruff
        
      - name: Run Ruff Linter
        run: ruff check backend/app/

  pytest-suite:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: diabetic_foot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          
      - name: Run Pytest
        env:
          PYTHONPATH: backend
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/diabetic_foot_test
          REDIS_URL: redis://localhost:6379/0
          STORAGE_PROVIDER: local
          LOCAL_STORAGE_DIR: ./test_uploads
          JWT_SECRET_KEY: test_secret_access_key_12345
          JWT_REFRESH_SECRET_KEY: test_secret_refresh_key_12345
        run: |
          pytest -v backend/tests/
